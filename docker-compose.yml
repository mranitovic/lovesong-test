version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: love_album_postgres
    environment:
      POSTGRES_DB: love_album_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d love_album_db"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data: